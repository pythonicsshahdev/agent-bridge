name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: a2a
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: pip install pytest pytest-asyncio
      - run: python -m pytest -q
        env:
          A2A_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test@localhost:5432/a2a

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.lock
      - name: start the demo
        run: |
          nohup demo/run.sh > demo.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8013/readyz >/dev/null 2>&1 && break; sleep 1; done
          sleep 12   # let it seed its traffic
          curl -sf http://127.0.0.1:8013/admin >/dev/null
      - name: browser tests
        working-directory: tests/browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm ci
          npm test
      - name: demo log on failure
        if: failure()
        run: tail -50 demo.log demo/proxy.log || true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t a2a-bridge:ci .
      - name: container starts and reports its config error cleanly
        run: |
          out=$(docker run --rm a2a-bridge:ci 2>&1 || true)
          echo "$out" | grep -q "configuration error"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - name: boot scripts
        run: |
          shellcheck files/prestart.sh files/run.sh
          sh tests/prestart_test.sh
