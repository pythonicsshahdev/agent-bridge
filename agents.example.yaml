server:
  host: "0.0.0.0"
  port: 8000
  database_url: "sqlite+aiosqlite:///./a2a_bridge.db"
  # public_base_url: "https://abc123.ngrok-free.app"   # advertised in agent cards; set to your tunnel URL
  # Who may call this proxy. Required unless you explicitly set mode: none.
  inbound_auth:
    mode: "api_key"                       # api_key | jwt | api_key_or_jwt | bearer_passthrough | none
    header_name: "X-API-Key"
    api_keys: ["${A2A_BRIDGE_API_KEY}"]   # quick start: one key, full access, taken from the environment
    # Production: per-client keys. Only the SHA-256 goes in config (run `a2a-bridge keygen`).
    # clients:
    #   - id: "crm-agent"
    #     key_sha256: ["<new hash>", "<old hash, remove after rotation>"]
    #     scopes: ["agents:boomi-order-sync"]       # or "agents:*"
    #     expires_at: "2027-06-30T00:00:00Z"
    # OAuth 2.0 / OIDC access tokens (mode: jwt or api_key_or_jwt). Scopes are agents:<slug> in the token.
    # jwt:
    #   issuer: "https://idp.example.com/"
    #   audience: "a2a-bridge"
    #   jwks_url: "https://idp.example.com/.well-known/jwks.json"
    #   discovery_url: "https://idp.example.com/.well-known/openid-configuration"   # advertised in cards
    rate_limit: {requests_per_minute: 120, burst: 30}   # per caller
    max_request_bytes: 1048576

agents:
  # Synchronous REST/Boomi web-services listener. Forwards the caller's Authorization header.
  - slug: "boomi-order-sync"
    name: "Boomi Order Fulfillment Agent"
    description: "Submits and tracks ERP orders through Boomi Web Services."
    version: "1.0.0"
    adapter:
      type: "http_sync"
      url: "https://boomi.com"   # placeholder: your Boomi listener URL
      method: "POST"
      timeout_seconds: 30
      auth:
        mode: "bearer_passthrough" # Options: none, bearer_passthrough, static_header
        header_name: "Authorization"
    skills:
      - id: "create_order"
        name: "Create ERP Order"
        description: "Creates a new order payload in the downstream ERP."
        tags: ["erp", "boomi", "orders"]

  # Trigger + poll: a 202 with a job id, then a status endpoint. Static key comes from the environment.
  - slug: "boomi-batch-export"
    name: "Boomi Batch Export Agent"
    description: "Starts a long-running Boomi export and reports progress."
    adapter:
      type: "http_async"
      url: "https://boomi.example.com/ws/rest/export/start"
      status_url: "https://boomi.example.com/ws/rest/export/status/{job_id}"
      job_id_path: "executionId"
      status_path: "status"
      completed_values: ["COMPLETE"]
      failed_values: ["ERROR", "ABORTED"]
      poll_interval_seconds: 2
      max_poll_seconds: 300
      auth:
        mode: "static_header"
        header_name: "X-API-Key"
        value: "${BOOMI_EXPORT_API_KEY}"
    skills:
      - id: "run_export"
        name: "Run Export"
        description: "Runs the batch export and returns its result."
        tags: ["boomi", "export"]
