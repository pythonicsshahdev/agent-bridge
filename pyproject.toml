[project]
name = "a2a-bridge"
version = "0.1.0"
description = "Declarative Universal A2A proxy: expose REST APIs, Boomi processes and agents as A2A agents from YAML."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "a2a-sdk[fastapi,sql]>=1.3",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "aiosqlite",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
a2a-bridge = "a2a_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_bridge"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
